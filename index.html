    <script>
      (function() {
        var currentFetch = window.fetch;
        function makeWritable(obj, prop) {
          if (!obj) return;
          try {
            var desc = Object.getOwnPropertyDescriptor(obj, prop);
            if (desc) {
              if (desc.get && !desc.set) {
                Object.defineProperty(obj, prop, {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: desc.enumerable !== false
                });
              } else if (!desc.writable && desc.configurable) {
                Object.defineProperty(obj, prop, {
                  writable: true,
                  configurable: true,
                  value: desc.value || currentFetch
                });
              }
            } else {
              try {
                Object.defineProperty(obj, prop, {
                  get: function() { return currentFetch; },
                  set: function(val) { currentFetch = val; },
                  configurable: true,
                  enumerable: true
                });
              } catch (_) {}
            }
          } catch (_) {}
        }

        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeWritable(Window.prototype, 'fetch');
          }
          var curr = window;
          while (curr) {
            makeWritable(curr, 'fetch');
            curr = Object.getPrototypeOf(curr);
          }
          if (typeof globalThis !== 'undefined') {
            makeWritable(globalThis, 'fetch');
          }
        } catch (_) {}

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, line, col, err) {
          var str = '' + msg + ' ' + (url || '') + ' ' + (err ? err.stack || err.message : '');
          if (
            str.indexOf('fetch') !== -1 ||
            str.indexOf('Cannot set property') !== -1 ||
            str.indexOf('chrome-extension') !== -1
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          var msg = (event && event.message) || '';
          var fn = (event && event.filename) || '';
          if (
            msg.indexOf('fetch') !== -1 ||
            msg.indexOf('Cannot set property') !== -1 ||
            fn.indexOf('chrome-extension') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || '' + reason)) || '';
          if (
            msg.indexOf('fetch') !== -1 ||
            msg.indexOf('Cannot set property') !== -1 ||
            msg.indexOf('chrome-extension') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
